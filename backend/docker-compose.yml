services:
  api:
    build:
      context: .
      dockerfile: Presentation/Dockerfile
    container_name: ticket-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ticket-network
    restart: unless-stopped

networks:
  ticket-network:
    driver: bridge
